services:
  - type: web
    name: safetyvision-guard
    runtime: python-3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "8000"
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
